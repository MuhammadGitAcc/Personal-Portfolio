name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Audit the packages shipped to visitors (fails on high severity)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all packages including dev tools (information only)
        run: npm audit --audit-level=high
        continue-on-error: true

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        env:
          VITE_EMAILJS_SERVICE_ID: ci-dummy-service-id
          VITE_EMAILJS_TEMPLATE_ID: ci-dummy-template-id
          VITE_EMAILJS_PUBLIC_KEY: ci-dummy-public-key

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error
